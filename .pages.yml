media:
  input: public/uploads
  output: /uploads
  categories: [image]
  rename: safe
content:
  - name: posts
    label: 文章
    type: collection
    path: content/posts
    format: json
    filename: "{fields.slug}.json"
    view:
      primary: title
      fields: [title, date, category, published]
      sort: date
      order: desc
    fields:
      - name: title
        label: 文章标题
        type: string
        required: true
      - name: slug
        label: 文章地址（小写英文、数字、连字符）
        type: string
        required: true
      - name: date
        label: 文章日期（按此日期排序，不是定时发布）
        type: date
        options:
          format: yyyy-MM-dd
        required: true
      - name: category
        label: 分类
        type: string
        default: AI 实践
        required: true
      - name: excerpt
        label: 摘要
        type: text
      - name: pinned
        label: 首页置顶
        type: boolean
        default: false
      - name: published
        label: 发布到博客（关闭则不显示在网站中）
        type: boolean
        default: false
      - name: sample
        label: 标记为示例内容
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
        required: true
  - name: thoughts
    label: 想法
    type: collection
    path: content/thoughts
    format: json
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.json"
    view:
      primary: text
      sort: date
      order: desc
    fields:
      - name: date
        label: 日期
        type: date
        options:
          format: yyyy-MM-dd
        required: true
      - name: text
        label: 想法正文
        type: text
        required: true
      - name: tag
        label: 标签
        type: string
      - name: published
        label: 显示在博客
        type: boolean
        default: true
  - name: site
    label: 网站设置
    type: file
    path: content/site.json
    format: json
    fields:
      - name: title
        label: 网站名称
        type: string
        required: true
      - name: author
        label: 作者
        type: string
        required: true
      - name: heading
        label: 首页标题
        type: string
        required: true
      - name: description
        label: 网站介绍
        type: text
        required: true
      - name: tagline
        label: 首页短句
        type: string
      - name: repository
        label: GitHub 仓库
        type: string
        readonly: true
      - name: branch
        label: 发布分支
        type: string
        readonly: true
      - name: url
        label: 站点地址（通常由自动发布配置）
        type: string
