<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
<rect width="760" height="330" rx="10" fill="#f9f9f6"/>
<rect x="30" y="28" width="320" height="192" rx="10" fill="#ffffff" stroke="#cfc8b8"/>
<text x="190" y="62" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3a33">写的时刻（第 3 拍）</text>
<text x="54" y="100" font-size="15" fill="#3f5a33">有：完整的现场</text>
<text x="54" y="124" font-size="13" fill="#7d776a">知道“她”是林晚，信是母亲留下的</text>
<text x="54" y="162" font-size="15" fill="#8c3f2c">缺：不知道以后会被问到什么</text>
<text x="54" y="200" font-size="15" font-weight="600" fill="#ad8a70">这时该做：理解</text>
<rect x="410" y="28" width="320" height="192" rx="10" fill="#ffffff" stroke="#cfc8b8"/>
<text x="570" y="62" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3a33">读的时刻（第 12 拍）</text>
<text x="434" y="100" font-size="15" fill="#3f5a33">有：知道这一拍要写什么</text>
<text x="434" y="124" font-size="13" fill="#7d776a">比如要交代那封信现在在哪</text>
<text x="434" y="162" font-size="15" fill="#8c3f2c">缺：当时的现场已经没了</text>
<text x="434" y="200" font-size="15" font-weight="600" fill="#ad8a70">这时该做：找相关的</text>
<line x1="352" y1="124" x2="398" y2="124" stroke="#9a9384" stroke-width="1.5"/><path d="M398 119 L408 124 L398 129 Z" fill="#9a9384"/>
<text x="380" y="112" text-anchor="middle" font-size="12" fill="#7d776a">时间</text>
<line x1="190" y1="220" x2="190" y2="252" stroke="#ad8a70" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="570" y1="220" x2="570" y2="252" stroke="#ad8a70" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="30" y="252" width="700" height="56" rx="8" fill="#f0e9df" stroke="#ad8a70"/>
<text x="380" y="286" text-anchor="middle" font-size="15" fill="#5f4b3c">中间的桥：保留原文。写入时的理解可能出错，读的时候还能回去核对</text>
</svg>
