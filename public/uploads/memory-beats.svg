<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
<rect width="760" height="340" rx="10" fill="#f9f9f6"/>
<line x1="130" y1="44" x2="730" y2="44" stroke="#bdb6a6" stroke-width="1.5"/>
<circle cx="260" cy="44" r="5" fill="#ad8a70"/><circle cx="590" cy="44" r="5" fill="#ad8a70"/>
<text x="260" y="30" text-anchor="middle" font-size="14" fill="#5f5a4f">第 3 拍 · 写入记忆</text>
<text x="590" y="30" text-anchor="middle" font-size="14" fill="#5f5a4f">第 12 拍 · 读取记忆</text>
<text x="24" y="126" font-size="15" font-weight="600" fill="#3d3a33">只存原话</text>
<rect x="130" y="80" width="260" height="84" rx="8" fill="#ffffff" stroke="#cfc8b8"/>
<text x="260" y="128" text-anchor="middle" font-size="15" fill="#3d3a33">“她把信藏进了那个盒子。”</text>
<line x1="392" y1="122" x2="442" y2="122" stroke="#9a9384" stroke-width="1.5"/><path d="M442 117 L452 122 L442 127 Z" fill="#9a9384"/>
<rect x="452" y="80" width="278" height="84" rx="8" fill="#f6e9e4" stroke="#c0705a"/>
<text x="591" y="116" text-anchor="middle" font-size="15" fill="#8c3f2c">她是谁？哪封信？哪个盒子？</text>
<text x="591" y="142" text-anchor="middle" font-size="13" fill="#8c3f2c">现场已经没了，补不回来</text>
<text x="24" y="256" font-size="15" font-weight="600" fill="#3d3a33">写入时消解</text>
<rect x="130" y="204" width="260" height="104" rx="8" fill="#ffffff" stroke="#cfc8b8"/>
<text x="260" y="240" text-anchor="middle" font-size="15" fill="#3d3a33">“林晚把母亲留下的信，</text>
<text x="260" y="264" text-anchor="middle" font-size="15" fill="#3d3a33">藏进了阁楼的樟木箱。”</text>
<text x="260" y="290" text-anchor="middle" font-size="13" fill="#7d776a">（第 3 拍，故事第 1 天夜里）</text>
<line x1="392" y1="256" x2="442" y2="256" stroke="#9a9384" stroke-width="1.5"/><path d="M442 251 L452 256 L442 261 Z" fill="#9a9384"/>
<rect x="452" y="204" width="278" height="104" rx="8" fill="#e8efe4" stroke="#6f8f5f"/>
<text x="591" y="248" text-anchor="middle" font-size="15" fill="#3f5a33">没在场的人也能看懂</text>
<text x="591" y="274" text-anchor="middle" font-size="13" fill="#3f5a33">可以直接接着往下写</text>
</svg>
